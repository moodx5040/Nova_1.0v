
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#080808"/>
    <stop offset=".55" stop-color="#171717"/>
    <stop offset="1" stop-color="#050505"/>
  </linearGradient>

  <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#ffffff"/>
    <stop offset=".25" stop-color="#777777"/>
    <stop offset=".5" stop-color="#d6d6d6"/>
    <stop offset=".75" stop-color="#555555"/>
    <stop offset="1" stop-color="#eeeeee"/>
  </linearGradient>

  <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#ff7777"/>
    <stop offset=".45" stop-color="#ff1010"/>
    <stop offset="1" stop-color="#870000"/>
  </linearGradient>

  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="7" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="shadow">
    <feGaussianBlur stdDeviation="5"/>
  </filter>
</defs>

<!-- Background -->
<rect width="512" height="512" rx="115" fill="url(#bg)"/>

<!-- Outer frame -->
<rect x="30" y="30" width="452" height="452" rx="100"
fill="none" stroke="#444444" stroke-width="5"/>

<rect x="37" y="37" width="438" height="438" rx="94"
fill="none" stroke="#111111" stroke-width="9"/>

<path d="M80 39 Q150 30 205 37"
stroke="#ff1717" stroke-width="4" fill="none"
filter="url(#glow)"/>

<path d="M430 473 Q475 450 475 390"
stroke="#ff1717" stroke-width="4" fill="none"
filter="url(#glow)"/>

<!-- Decorative N shadow -->
<path d="M145 355 L145 160
C145 135 170 125 190 150
L326 333
C345 357 370 345 370 319
L370 155"
fill="none" stroke="#000000" stroke-width="52"
stroke-linecap="round" stroke-linejoin="round"
filter="url(#shadow)"/>

<!-- Main N -->
<path d="M145 355 L145 160
C145 135 170 125 190 150
L326 333
C345 357 370 345 370 319
L370 155"
fill="none" stroke="url(#silver)" stroke-width="34"
stroke-linecap="round" stroke-linejoin="round"/>

<!-- Red neon details -->
<path d="M145 355
C115 390 145 418 180 396
C197 385 203 372 208 360"
fill="none" stroke="url(#red)" stroke-width="7"
stroke-linecap="round" filter="url(#glow)"/>

<path d="M145 160
C116 123 148 103 178 119
C195 128 207 142 215 155"
fill="none" stroke="#ff1717" stroke-width="6"
stroke-linecap="round" filter="url(#glow)"/>

<path d="M370 155
C404 121 381 94 351 111
C335 120 326 135 320 147"
fill="none" stroke="#ff1717" stroke-width="6"
stroke-linecap="round" filter="url(#glow)"/>

<path d="M326 333
C354 367 390 348 385 319"
fill="none" stroke="#ff1717" stroke-width="5"
stroke-linecap="round" filter="url(#glow)"/>

<!-- Decorative ornaments -->
<path d="M112 205 Q130 185 138 164"
fill="none" stroke="#aaaaaa" stroke-width="3"/>

<path d="M397 270 Q380 286 379 305"
fill="none" stroke="#aaaaaa" stroke-width="3"/>

<path d="M255 87 L263 108 L284 116
L263 124 L255 145 L247 124 L226 116 L247 108Z"
fill="#ff2020" filter="url(#glow)"/>

<circle cx="108" cy="285" r="5" fill="#ff2020"
filter="url(#glow)"/>

<circle cx="405" cy="208" r="5" fill="#ff2020"
filter="url(#glow)"/>

<circle cx="256" cy="414" r="4" fill="#bdbdbd"/>

</svg>
